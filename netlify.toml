[build]
  publish = "dist"
  command = "npm run build"

# Configuración para desarrollo local con `netlify dev`
# Inicia Vite en 5173 y expone todo (frontend + funciones) en localhost:8888
[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888
  framework = "#custom"
  autoLaunch = false

[[redirects]]
  from = "/api"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200
